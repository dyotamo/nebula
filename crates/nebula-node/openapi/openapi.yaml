openapi: 3.1.0
info:
  title: NebulaCache REST API
  version: 0.1.0
  summary: HTTP interface for a NebulaCache node
  license:
    name: MIT
  description: >-
    Operate on a single node's in-memory cache over HTTP. Entries are volatile
    and are not shared with other nodes. The REST listener is disabled unless
    the node is started with `--rest-api`. Its default bind address is
    `0.0.0.0:7002`; configure it with `--rest-listen HOST:PORT`. This API has
    no authentication, TLS, or CORS support. Bind it only to trusted interfaces
    and apply suitable network controls before exposing it to clients.
tags:
  - name: Service
    description: Service health and API specification.
  - name: Cache
    description: Read and modify cache entries.
paths:
  /openapi.yaml:
    get:
      tags:
        - Service
      summary: Retrieve the OpenAPI specification
      description: Returns this API definition as YAML.
      operationId: getOpenApiSpecification
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string
  /v1/ping:
    get:
      tags:
        - Service
      summary: Check node connectivity
      description: Returns the literal text `PONG` when the node is reachable.
      operationId: ping
      responses:
        '200':
          description: The node is reachable.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - PONG
              example: PONG
  /v1/keys/{key}:
    parameters:
      - $ref: '#/components/parameters/Key'
    get:
      tags:
        - Cache
      summary: Retrieve a cached value
      description: >-
        Returns the stored bytes without JSON or text conversion. Values may be
        empty or contain arbitrary binary data. Expired entries are treated as
        missing.
      operationId: getValue
      responses:
        '200':
          description: The value associated with the key.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/CacheValue'
              examples:
                text:
                  summary: UTF-8 value
                  value: hello
        '400':
          description: The key path could not be decoded as a UTF-8 string.
        '404':
          description: No unexpired entry exists for this key.
    put:
      tags:
        - Cache
      summary: Store a value
      description: >-
        Stores the request body bytes under the key, replacing any existing
        value. The body may be empty and is limited to 2 MiB by the server's
        default HTTP body limit.
      operationId: setValue
      parameters:
        - name: ttl_secs
          in: query
          required: false
          description: >-
            Entry lifetime in seconds. Omit this parameter or set it to zero
            for an entry that does not expire.
          schema:
            type: integer
            minimum: 0
            maximum: 18446744073709551615
            default: 0
          example: 60
      requestBody:
        required: true
        description: Raw value bytes; no JSON or text encoding is applied.
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/CacheValue'
            examples:
              text:
                summary: UTF-8 value
                value: hello
      responses:
        '204':
          description: Value stored successfully; the response has no body.
        '400':
          description: The key path or query string is invalid.
        '413':
          description: Request body exceeds the server's 2 MiB default limit.
    delete:
      tags:
        - Cache
      summary: Delete a cached value
      description: Removes the key and its value from this node's cache.
      operationId: deleteValue
      responses:
        '204':
          description: The key existed and was deleted; the response has no body.
        '400':
          description: The key path could not be decoded as a UTF-8 string.
        '404':
          description: No entry exists for this key.
components:
  parameters:
    Key:
      name: key
      in: path
      required: true
      description: >-
        Non-empty UTF-8 cache key. Percent-encode reserved characters when
        placing them in the URL path.
      schema:
        $ref: '#/components/schemas/CacheKey'
      example: greeting
  schemas:
    CacheKey:
      type: string
      minLength: 1
      description: UTF-8 cache key.
      examples:
        - greeting
        - user:42
    CacheValue:
      type: string
      format: binary
      description: Arbitrary value bytes carried directly in the HTTP body.
