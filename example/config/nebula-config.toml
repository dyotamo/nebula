listen_addr = "127.0.0.1:7001"
log_level = "debug"
shutdown_timeout_secs = 30

[admin_console]
enabled = true
listen_addr = "127.0.0.1:7002"
metrics_dashboard = true
password = "admin"

[tls]
enabled = true
certificate = "${NEBULA_TLS_CERTIFICATE:-./example/config/tls/server.pem}"
private_key = "${NEBULA_TLS_PRIVATE_KEY:-./example/config/tls/server-key.pem}"

[persistence]
mode = "snapshot"
snapshot_dir = "./data/snapshots"
snapshot_interval_secs = 60
snapshot_retention = 3

[metrics]
enabled = true
listen_addr = "127.0.0.1:7003"
