services:
  nebula-1:
    build: .
    command: ["--listen", "0.0.0.0:7001"]
    ports: ["7001:7001"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7001'"]
      interval: 5s
      timeout: 2s
      retries: 5

  nebula-2:
    build: .
    command: ["--listen", "0.0.0.0:7001"]
    ports: ["7002:7001"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7001'"]
      interval: 5s
      timeout: 2s
      retries: 5

  nebula-3:
    build: .
    command: ["--listen", "0.0.0.0:7001"]
